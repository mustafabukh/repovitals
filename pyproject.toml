[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repovitals"
version = "0.1.0"
description = "Analyze the maintenance health of Git repositories and Python dependencies"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mustafa Bukhari M. Ahmed", email = "mustafa.bukh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/mustafabukhari/repovitals"
Repository = "https://github.com/mustafabukhari/repovitals"
Issues = "https://github.com/mustafabukhari/repovitals/issues"

[project.scripts]
repovitals = "repovitals.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
